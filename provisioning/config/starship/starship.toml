# ═══════════════════════════════════════════════════════════
#  Starship — Cross-shell powerful prompt (WowMacDev)
#  Fork of the dotfiles project's Catppuccin Mocha prompt,
#  upgraded with full language / cloud / container coverage.
# ═══════════════════════════════════════════════════════════

# ── Global format ─────────────────────────────────────────
format = """
$username
$hostname
$directory
$git_branch
$git_status
$package
$kubernetes
$terraform
$aws
$azure$gcloud
$docker_context
$nodejs
$python
$rust
$golang
$java
$go$ruby$swift$zig
$cmake$docker$c
$shlvl$cmd_duration
$line_break
$character"""

# ── Palette: Catppuccin Mocha ─────────────────────────────
palette = "catppuccin_mocha"

[palettes.catppuccin_mocha]
text = "#cdd6f4"
surface0 = "#313244"
surface1 = "#45475a"
subtext0 = "#a6adc8"
overlay0 = "#6c7086"
overlay1 = "#7f849c"
maroon = "#f38ba8"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
mauve = "#cba6f7"
pink = "#f5c2e7"
blue = "#89b4fa"
sapphire = "#74c7ec"
teal = "#94e2d5"
flamingo = "#f2cdcd"
lavender = "#b4befe"
red = "#f38ba8"

# ── Username ──────────────────────────────────────────────
[username]
show_always = false
style_user = "blue"
style_root = "maroon"
format = "[$user]($style) in "

# ── Hostname ──────────────────────────────────────────────
[hostname]
ssh_only = true
format = "on [$hostname](teal) "
trim_at = ".local"

# ── Directory ─────────────────────────────────────────────
[directory]
style = "blue"
truncation_length = 4
truncate_to_repo = true
home_symbol = " 󰋜 "
read_only = " 󰌾 "
read_only_style = "overlay0"
format = "[$path]($style)[$read_only]($read_only_style)"

# ── Git Branch ────────────────────────────────────────────
[git_branch]
symbol = " "
style = "mauve"
format = "on [$symbol($branch )]($style)"

# ── Git Status ────────────────────────────────────────────
[git_status]
format = '\([$all_status$ahead_behind]($style)\) '
style = "peach"
conflicted = "⚔"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?${count}"
stashed = "⚑"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "-${count}"

# ── Languages ─────────────────────────────────────────────
[nodejs]
symbol = " 󰎙 "
style = "green"
format = "via [$symbol($version)]($style) "

[python]
symbol = " 󰌠 "
style = "yellow"
format = "via [$symbol$virtualenv($version)]($style) "

[rust]
symbol = " 󱘗 "
style = "maroon"
format = "via [$symbol($version)]($style) "

[golang]
symbol = " 󰟓 "
style = "teal"
format = "via [$symbol($version)]($style) "

[java]
symbol = " ☕ "
style = "sapphire"
format = "via [$symbol($version)]($style) "

[ruby]
symbol = " 󰴭 "
style = "red"
format = "via [$symbol($version)]($style) "

[swift]
symbol = " 󰛥 "
style = "peach"
format = "via [$symbol($version)]($style) "

[lua]
symbol = " 󰢱 "
style = "blue"
format = "via [$symbol($version)]($style) "

[dotnet]
symbol = " dotnet::"
style = "mauve"
format = "[$symbol($version)( $tfm )]($style) "

[cmake]
style = "blue"
symbol = " cmake::"
format = "[$symbol($version)]($style) "

# ── Version control platforms / contexts ──────────────────
[kubernetes]
symbol = " ☸ "
style = "blue"
format = 'on [$symbol($context)]($style) '

[terraform]
symbol = " 󱁢 "
style = "mauve"
format = "[$symbol$workspace]($style)$select_symbol "

[aws]
symbol = " 󱓤 "
format = 'on [$symbol($profile)(\($region\))( \($type\))($duration)]($style) '
style = "yellow"

[azure]
symbol = " 󰗥 "
format = "on [$symbol($subscription)]($style) "
style = "blue"

[gcloud]
symbol = " 󱪔 "
format = "on [$symbol($project)]($style) "
style = "green"

[docker_context]
symbol = " 󰡨 "
format = "via [$symbol$context]($style) "
style = "teal"

# ── Command duration ──────────────────────────────────────
[cmd_duration]
min_time = 2000
show_notifications = true
notification_timeout = 5000
style = "subtext0"
format = "took [$duration]($style) "
disabled = false

# ── Exit status ───────────────────────────────────────────
[status]
disabled = false
format = '[\($symbol$common_meaning$signal_name$maybe_int\)]($style) '

# ── Battery / Powerline spacer (kept minimal for breathing room) ──
[os]
disabled = true

# ── Character / Cursor ────────────────────────────────────
[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vicmd_symbol = "[❮](bold teal)"

# ── Line break ────────────────────────────────────────────
[line_break]
disabled = false