# ═══════════════════════════════════════════════════════════
#  Starship — LIGHT profile
# ═══════════════════════════════════════════════════════════
#  Selected by:  profile light
#  (sets STARSHIP_CONFIG to this file and switches the Apple
#  Terminal scheme to Dev:Light)
#
#  GENERATED from starship.toml — same layout, darkened palette.
#  The dark palette cannot be reused: colours tuned for #1c1b1f
#  (the green #a9dc76, the teal #78dce8) fall to ~1.5:1 on white
#  and are effectively invisible. Every entry below clears WCAG
#  AA (4.5:1) against the #fdfdfd background.
#
#  If you edit starship.toml, re-apply the same palette edits
#  here, or the two profiles drift apart.
# ═══════════════════════════════════════════════════════════

# ═══════════════════════════════════════════════════════════
#  Starship — single-line developer prompt for Apple Terminal
#  Palette: "Chroma spectrum", tuned for the Dev:Default scheme.
# ═══════════════════════════════════════════════════════════
#
#  Load order note: zsh-syntax-highlighting is sourced last by
#  95-plugins.zsh, so it can safely re-wrap the ZLE widgets that
#  `starship init zsh` installs.
#
#  Performance note: the `package` module walks the directory tree
#  on every prompt. Its default 30 ms budget aborts on slow
#  filesystems (iCloud, Spotlight, a build running) and prints a
#  warning, so the budget is raised and symlink-following is off.
# ═══════════════════════════════════════════════════════════

format = "$directory$git_branch$git_status$character$cmd_duration"
# Everything not named above is right-aligned before the cursor.
right_format = "$status$package$hostname$aws$azure$gcloud$docker_context$kubernetes$terraform$python$nodejs$golang$rust$java$ruby$swift$lua$env_var"

scan_timeout = 500
follow_symlinks = false

# ── Palette ───────────────────────────────────────────────
palette = "chroma"

[palettes.chroma]
text      = "#24292f"
surface   = "#f0f1f3"
subtext   = "#57606a"
overlay   = "#6e7781"
blue      = "#bc4c00"   # accent (Monokai orange)
red       = "#cf222e"
green     = "#116329"
yellow    = "#7d4e00"
teal      = "#1b7c83"
mauve     = "#8250df"
peach     = "#bc4c00"
maroon    = "#a40e26"
pink      = "#8250df"
sapphire  = "#0969da"
lavender  = "#8250df"
flamingo  = "#7d4e00"
# Extra roles used by the environment modules below.
prod      = "#a40e26"   # production: loud on purpose
warn      = "#7d4e00"
dev       = "#0969da"

# ── Directory ─────────────────────────────────────────────
[directory]
style = "blue"
truncation_length = 4
truncate_to_repo = true
home_symbol = "~"
read_only = " 🔒"
read_only_style = "overlay"
format = "[$path]($style)[$read_only]($read_only_style) "

# ── Git ───────────────────────────────────────────────────
[git_branch]
symbol = " "
style = "mauve"
format = "on [$symbol$branch]($style) "

[git_state]
format = 'on [$symbol$state]($style) '

# Starship hides this module entirely when the tree is clean and
# there is no ahead/behind delta, so a clean repo costs zero
# prompt width. `up_to_date` and `stashed` are emptied so a synced
# branch does not print a meaningless marker.
[git_status]
style = "red"
format = '([\[$all_status$ahead_behind\]]($style) )'
conflicted = "⚠${count}"
ahead      = "⇡${count}"
behind     = "⇣${count}"
diverged   = "⇕⇡${ahead_count}⇣${behind_count}"
up_to_date = ""
untracked  = "?${count}"
stashed    = ""
modified   = "!${count}"
staged     = "+${count}"
renamed    = "»${count}"
deleted    = "✘${count}"

# ── Command outcome ───────────────────────────────────────
# Two signals, no redundancy:
#   * the ❯ turns red on a non-zero exit (the `character` module)
#   * this module adds the numeric code on the right, and stays
#     completely silent on success because `success_symbol` is
#     empty — a clean run costs zero prompt width.
# NOTE: this module is disabled by default upstream, and the
# per-state keys are `symbol` / `success_symbol`, not a
# `map_symbol` table. Older examples found online will not load.
[status]
disabled = false
format = '[$symbol$status]($style) '
symbol = '✖'
success_symbol = ''
style = "bold red"

[cmd_duration]
min_time = 2000
style = "subtext"
format = "took [$duration]($style) "

[package]
disabled = true       # it forces a tree walk on every prompt

# ── Runtimes ──────────────────────────────────────────────
# Only rendered inside a project that actually uses the runtime.
[nodejs]
symbol = " 󰎙 "
style = "green"
format = "via [$symbol($version )]($style)"

[rust]
symbol = " 󱘗 "
style = "red"
format = "via [$symbol($version )]($style)"

[golang]
symbol = " 󰟓 "
style = "blue"
format = "via [$symbol($version )]($style)"

[python]
symbol = " 󰌠 "
style = "yellow"
# virtualenv is what matters here; the base interpreter version is
# noise when you are inside an activated environment.
format = 'via [$symbol($virtualenv )]($style)'

[java]
symbol = " 󰃞 "
style = "teal"
format = "via [$symbol($version )]($style)"

[swift]
symbol = " 󰛥 "
style = "peach"
format = "via [$symbol($version )]($style)"
# ── Cloud / cluster context ───────────────────────────────
# NOTE: the `kubernetes` and `azure` modules are DISABLED BY
# DEFAULT in Starship and silently render nothing until
# `disabled = false` is set. That is the single easiest thing to
# get wrong here, and it is why the previous prompt never showed a
# cluster context.
[kubernetes]
disabled = false
symbol = "☸ "
format = '[$symbol$context \($namespace\)]($style) '
style = "blue"
# Context-specific styling, matched as a regex. Order matters:
# the first entry that matches wins, so production is listed
# before the general staging pattern.
contexts = [
  { context_pattern = ".*(prod|prd|production|live).*", style = "bold red",   symbol = "☸ ", context_alias = "PROD" },
  { context_pattern = ".*(stag|staging|preprod|pre-prod).*", style = "bold yellow", symbol = "☸ " },
  { context_pattern = ".*(dev|local|kind|minikube).*", style = "teal",       symbol = "☸ " },
]

[helm]
symbol = " 󰛥 "
style = "teal"

[terraform]
symbol = " 󱁢 "
style = "mauve"
format = "[$symbol$workspace]($style)$select_symbol "

[aws]
symbol = " 󱓤 "
format = 'on [$symbol$profile($region )]($style) '
style = "yellow"
# `profile_aliases` cannot be a regex table, so production
# detection for AWS lives in the shell: see cloud-env-report and
# awsprod-guard in zsh/60-cloud.zsh.

[azure]
disabled = false          # also disabled by default upstream
symbol = " 󰗥 "
format = "on [$symbol$subscription]($style) "
style = "blue"

[gcloud]
symbol = " 󱪇 "
format = "on [$symbol$account($region )]($style) "
style = "green"

[docker_context]
symbol = " 󰡨 "
format = "via [$symbol$context]($style) "
style = "teal"

[direnv]
symbol = " 󰌠 "
style = "blue"
format = 'via [$symbol$version ($env_name )]($style) '

[hostname]
# Shown in the right-hand block so an SSH session is obvious
# without pushing the context around.
ssh_only = true
ssh_symbol = "⇄ "
style = "bold yellow"
format = "[$ssh_symbol$hostname]($style) "
trim_at = "."

# ── Environment overrides ─────────────────────────────────
[env_var]
# Virtualenv, activated by direnv or by hand.
VIRTUAL_ENV = { style = "bold yellow", format = "($value )" }
CONDA_DEFAULT_ENV = { style = "bold yellow", format = "($value )" }
# Anything explicitly flagged as production.
K8S_ENVIRONMENT = { style = "bold red", format = "($value )" }
DEPLOY_ENV = { style = "bold red", format = "($value )" }
# Terraform workspaces that are not 'default'.
TF_WORKSPACE = { style = "bold red", format = "($value )" }

# ── Cursor ────────────────────────────────────────────────
# Green = last command succeeded, red = it failed. This is the
# single most useful signal in the whole prompt.
[character]
success_symbol = "[❯](bold green)"
error_symbol   = "[❯](bold red)"
vicmd_symbol   = "[❮](bold teal)"

# Apple Terminal has no strikethrough or dimmed support, so
# `dimmed` is avoided in favour of explicit muted colours above.
[line_break]
disabled = true
