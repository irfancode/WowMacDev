# ═══════════════════════════════════════════════════════════
#  Starship — Chroma-spesighted, single-line developer prompt
#  Palette follows the Chroma "spectrum" terminal theme so the
#  prompt colors match Ghostty/beautify exactly.
# ═══════════════════════════════════════════════════════════

# Single compact line: primary info left, context right, then cursor.
format = """
$username$hostname$directory$git_branch$git_status$status$package$cmd_duration$line_break$character"""

# ── Palette: Chroma spectrum ───────────────────────────────
palette = "chroma_spectrum"

[palettes.chroma_spectrum]
text    = "#fcfcfa"
surface = "#2d2a2e"
subtext = "#727072"
overlay = "#727072"
blue    = "#fc9867"   # accent (Monokai orange)
red     = "#ff6188"
green   = "#a9dc76"
yellow  = "#ffd866"
teal    = "#78dce8"
mauve   = "#ab9df2"
peach   = "#fc9867"
maroon  = "#ff6188"
pink    = "#ab9df2"
sapphire= "#78dce8"
lavender= "#ab9df2"
flamingo= "#ffd866"

# ── Username / Hostname ────────────────────────────────────
[username]
show_always = false
style_user = "text"
style_root = "maroon"
format = "[$user]($style) "

[hostname]
ssh_only = true
style = "mauve"
format = "on [$hostname]($style) "
trim_at = ".local"

# ── Directory ──────────────────────────────────────────────
[directory]
style = "blue"
truncation_length = 4
truncate_to_repo = true
home_symbol = "~"
read_only = " 🔒"
read_only_style = "overlay"
format = "[$path]($style)[$read_only]($read_only_style)"

# ── Git ────────────────────────────────────────────────────
[git_branch]
symbol = ""
style = "mauve"
format = "on [$symbol$branch]($style) "

[git_status]
format = '([\[$all_status$ahead_behind\]]($style) )'
style = "maroon"
conflicted = "⚔ "
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?${count}"
stashed = "📦"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"

# ── Language runtimes (compact, right-aligned block) ───────
[nodejs]
symbol = " 󰎙 "
style = "green"
format = "via [$symbol($version)]($style) "

[rust]
symbol = " 󱘗 "
style = "maroon"
format = "via [$symbol($version)]($style) "

[golang]
symbol = " 󰟓 "
style = "blue"
format = "via [$symbol($version)]($style) "

[python]
symbol = " 󰌠 "
style = "yellow"
format = "via [$symbol$virtualenv($version)]($style) "

[java]
symbol = " ☕ "
style = "sapphire"
format = "via [$symbol($version)]($style) "

[ruby]
symbol = " 󰴭 "
style = "maroon"
format = "via [$symbol($version)]($style) "

[swift]
symbol = " 󰛥 "
style = "peach"
format = "via [$symbol($version)]($style) "

[lua]
symbol = " 󰢱 "
style = "blue"
format = "via [$symbol($version)]($style) "

# ── Clouds / context ───────────────────────────────────────
[kubernetes]
symbol = " ☸ "
style = "blue"
format = 'on [$symbol$context]($style) '

[terraform]
symbol = " 󱁢 "
style = "mauve"
format = "[$symbol$workspace]($style)$select_symbol "

[aws]
symbol = " 󱓤 "
format = 'on [$symbol$profile($region)( $type)]($style) '
style = "yellow"

[azure]
symbol = " 󰗥 "
format = "on [$symbol$subscription]($style) "
style = "blue"

[gcloud]
symbol = " 󱪇 "
format = 'on [$symbol$account($region)]($style) '
style = "green"

[docker_context]
symbol = " 󰡨 "
format = "via [$symbol$context]($style) "
style = "teal"

# ── Meta ──────────────────────────────────────────────────
[cmd_duration]
min_time = 2000
show_notifications = true
notification_timeout = 5000
style = "subtext"
format = "took [$duration]($style) "

[status]
disabled = false
format = '[($symbol$common_meaning$signal_name$maybe_int)]($style) '

[os]
disabled = true

[package]
symbol = " "
style = "subtext"

# ── Cursor ────────────────────────────────────────────────
[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vicmd_symbol = "[❮](bold teal)"

[line_break]
disabled = false