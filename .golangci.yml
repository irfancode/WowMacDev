version: "2"

run:
  timeout: 10m

linters:
  enable:
    - govet
    - staticcheck
    - ineffassign
    - unused
    - errcheck
    - gosec
    - misspell
    - gofmt
    - goimports
    - revive
  disable:
    - depguard

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
        - gosec

output:
  formats:
    - format: colored-line-number
